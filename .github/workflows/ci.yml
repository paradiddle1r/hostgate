# CI — runs the checks Vercel's build doesn't: type-checking and unit tests.
# (Vercel builds on every push already, so no `next build` here.)
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
